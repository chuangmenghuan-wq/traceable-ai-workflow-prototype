name: horse-round038-identity-bootstrap
on:
  push:
    branches:
      - research/horse-round038-identity-bootstrap
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horse-round038-identity-bootstrap
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
      BETFAIR_SSOID: ${{ secrets.BETFAIR_SSOID }}
      BETFAIR_DELAYED_APP_KEY: ${{ secrets.BETFAIR_DELAYED_APP_KEY }}
      BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
      BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      BETFAIR_CERT_PEM: ${{ secrets.BETFAIR_CERT_PEM }}
      BETFAIR_CERT_KEY_PEM: ${{ secrets.BETFAIR_CERT_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Audit Betfair identity bootstrap transport
        run: python research/horse_round038_identity_bootstrap.py
      - name: Commit sanitized output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/horse_round038
          git diff --cached --quiet && exit 0
          git commit -m "research: record horse round038 identity bootstrap"
          git push
