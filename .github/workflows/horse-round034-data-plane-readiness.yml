name: horse-round034-data-plane-readiness
on:
  push:
    branches:
      - research/horse-round034-data-plane-readiness
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horse-round034-data-plane-readiness
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Execute frozen data-plane readiness audit
        run: python research/horse_round034_data_plane_readiness.py
      - name: Commit compact research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/horse_round034
          git diff --cached --quiet && exit 0
          git commit -m "research: record horse round034 data-plane readiness"
          git push
