name: horse-round046-parallel-settlement

on:
  workflow_run:
    workflows: ["horse-round045-state-parallel-paper"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horse-round046-parallel-settlement
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Settle all parallel paper candidates by state
        run: python research/horse_round046_parallel_settlement.py

      - name: Persist round046 settlement evidence
        shell: bash
        run: |
          if git status --porcelain research_outputs/horse_round046 | grep -q .; then
            git config user.name "future-ability-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add research_outputs/horse_round046
            git commit -m "research: round046 parallel paper settlement"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No round046 settlement changes to persist."
          fi
