name: horse-round042-bff-public-probe

on:
  push:
    branches:
      - research/horse-round042-bff-public-probe
    paths:
      - .github/workflows/horse-round042-bff-public-probe.yml

permissions:
  contents: read

jobs:
  public-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe credential-free racing data surfaces
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.error

          UA = "FutureAbility-HorseResearch/round042 read-only capability probe"

          def fetch(label, url, headers=None):
              h = {"User-Agent": UA, "Accept": "application/json,text/html;q=0.9,*/*;q=0.8"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(url, headers=h, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read(2_000_000)
                      print(f"{label}_HTTP={r.status}")
                      print(f"{label}_CONTENT_TYPE={r.headers.get('content-type','')}")
                      print(f"{label}_BODY_BYTES={len(body)}")
                      return r.status, r.headers, body
              except urllib.error.HTTPError as e:
                  body = e.read(200_000)
                  print(f"{label}_HTTP={e.code}")
                  print(f"{label}_CONTENT_TYPE={e.headers.get('content-type','')}")
                  print(f"{label}_BODY_BYTES={len(body)}")
                  print(f"{label}_ERROR_PREFIX={body[:200].decode('utf-8','replace')!r}")
                  return e.code, e.headers, body
              except Exception as e:
                  print(f"{label}_ERROR={type(e).__name__}:{e}")
                  return None, {}, b""

          bff_url = "https://bff.senservices.betfair.com.au/api/v1/hub/thoroughbred-model?date=2026-08-12"
          status, headers, body = fetch("BFF", bff_url)
          if status == 200:
              try:
                  payload = json.loads(body)
                  if isinstance(payload, dict):
                      print("BFF_TOP_KEYS=" + ",".join(sorted(payload.keys())))
                      events = payload.get("events") or []
                  elif isinstance(payload, list):
                      print("BFF_TOP_TYPE=list")
                      events = payload
                  else:
                      events = []
                  print(f"BFF_EVENT_COUNT={len(events)}")
                  if events:
                      event = events[0]
                      print(f"BFF_FIRST_EVENT_NAME={event.get('name')}")
                      markets = event.get("markets") or []
                      print(f"BFF_FIRST_EVENT_MARKETS={len(markets)}")
                      if markets:
                          market = markets[0]
                          print("BFF_MARKET_KEYS=" + ",".join(sorted(market.keys())))
                          runners = market.get("runners") or []
                          print(f"BFF_FIRST_MARKET_RUNNERS={len(runners)}")
                          if runners:
                              runner = runners[0]
                              wanted = ["id","name","ratedPrice","backPrice","layPrice","value","status"]
                              print("BFF_RUNNER_FIELDS=" + json.dumps({k: runner.get(k) for k in wanted}, separators=(",",":")))
                              print("BFF_REQUIRED_FIELDS_PRESENT=" + str(all(k in runner for k in ["ratedPrice","backPrice","layPrice","value"])).lower())
              except Exception as e:
                  print(f"BFF_JSON_PARSE_ERROR={type(e).__name__}:{e}")

          ra_url = "https://www.racingaustralia.horse/FreeFields/Form.aspx?Key=2026Aug12%2CSA%2CThomas+Farms+RC+Murray+Bridge"
          status, headers, body = fetch("RA", ra_url, {"Accept": "text/html,*/*;q=0.8"})
          text = body.decode("utf-8", "replace")
          compact = re.sub(r"\s+", " ", text)
          print("RA_HEAVY9=" + str("Heavy 9" in compact).lower())
          print("RA_STRONG_MINDED=" + str("STRONG MINDED" in compact.upper()).lower())
          print("RA_FINALFIELDS_PUBLISHED=" + str("FinalFields Last Published" in compact).lower())
          print("ROUND042_PROBE_COMPLETE=true")
          PY
