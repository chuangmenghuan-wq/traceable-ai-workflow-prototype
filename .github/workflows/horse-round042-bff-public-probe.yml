name: horse-round042-bff-public-probe

on:
  push:
    branches:
      - research/horse-round042-bff-public-probe
    paths:
      - .github/workflows/horse-round042-bff-public-probe.yml

permissions:
  contents: read

jobs:
  public-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe credential-free racing data surfaces
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.error

          UA = "FutureAbility-HorseResearch/round042 read-only capability probe"

          def fetch(label, url, accept="application/json,text/html;q=0.9,*/*;q=0.8"):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": accept}, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read(2_000_000)
                      print(f"{label}_HTTP={r.status}")
                      print(f"{label}_CONTENT_TYPE={r.headers.get('content-type','')}")
                      print(f"{label}_BODY_BYTES={len(body)}")
                      return r.status, body
              except urllib.error.HTTPError as e:
                  body = e.read(200_000)
                  print(f"{label}_HTTP={e.code}")
                  print(f"{label}_BODY_BYTES={len(body)}")
                  print(f"{label}_ERROR_PREFIX={body[:200].decode('utf-8','replace')!r}")
                  return e.code, body
              except Exception as e:
                  print(f"{label}_ERROR={type(e).__name__}:{e}")
                  return None, b""

          def bff(date):
              label = "BFF_" + date.replace("-", "")
              status, body = fetch(label, "https://bff.senservices.betfair.com.au/api/v1/hub/thoroughbred-model?date=" + date)
              if status != 200:
                  return None
              payload = json.loads(body)
              events = payload.get("events") or []
              print(f"{label}_EVENT_COUNT={len(events)}")
              if not events or not (events[0].get("markets") or []):
                  return None
              event = events[0]
              market = event["markets"][0]
              runners = market.get("runners") or []
              print(f"{label}_FIRST_EVENT={event.get('name')}")
              print(f"{label}_MARKET_ID={market.get('id')}")
              print(f"{label}_MARKET_STATUS={market.get('status')}")
              print(f"{label}_MARKET_START={market.get('startTime')}")
              if runners:
                  r = runners[0]
                  wanted = ["id","name","ratedPrice","backPrice","layPrice","value","status"]
                  print(f"{label}_RUNNER_FIELDS=" + json.dumps({k: r.get(k) for k in wanted}, separators=(",",":")))
              return str(market.get("id")) if market.get("id") else None

          historical_market = bff("2026-08-11")
          bff("2026-08-12")

          if historical_market:
              probes = {
                  "MOVERS": f"https://bff.senservices.betfair.com.au/api/v1/models/racing-market-movers/{historical_market}",
                  "RATING": f"https://bff.senservices.betfair.com.au/api/v1/models/racing-rating-model/{historical_market}?modelName=BFA_THOROUGHBRED",
                  "HEADER": f"https://bff.senservices.betfair.com.au/api/v1/bema/race-market-screen/market-header/{historical_market}",
                  "RUNNERS": f"https://bff.senservices.betfair.com.au/api/v1/bema/race-market-screen/runners-list/{historical_market}",
              }
              for label, url in probes.items():
                  status, body = fetch(label, url)
                  if status == 200:
                      try:
                          data = json.loads(body)
                          if label == "MOVERS" and isinstance(data, dict):
                              sels = data.get("selections") or []
                              print(f"MOVERS_SELECTION_COUNT={len(sels)}")
                              if sels:
                                  wanted = ["selectionId","morningPrice","fifteenMinPrice","lastTradedPrice","movement","moverStatus"]
                                  print("MOVERS_FIRST=" + json.dumps({k: sels[0].get(k) for k in wanted}, separators=(",",":")))
                          elif label == "HEADER" and isinstance(data, dict):
                              wanted = ["id","status","startTime","trackCondition","weather","raceDist","raceClass"]
                              print("HEADER_FIELDS=" + json.dumps({k: data.get(k) for k in wanted}, separators=(",",":")))
                          elif label == "RUNNERS" and isinstance(data, list):
                              print(f"RUNNERS_COUNT={len(data)}")
                              if data:
                                  md = data[0].get("runnerMetadata") or {}
                                  print("RUNNERS_FIRST_META=" + json.dumps({"id":data[0].get("id"),"name":data[0].get("name"),"bsp":data[0].get("bsp"),"stallDraw":md.get("stallDraw"),"jockeyName":md.get("jockeyName"),"trainerName":md.get("trainerName")}, separators=(",",":")))
                          elif label == "RATING":
                              print("RATING_JSON_TYPE=" + type(data).__name__)
                      except Exception as e:
                          print(f"{label}_PARSE_ERROR={type(e).__name__}:{e}")

          ra_url = "https://www.racingaustralia.horse/FreeFields/Form.aspx?Key=2026Aug12%2CSA%2CThomas+Farms+RC+Murray+Bridge"
          status, body = fetch("RA", ra_url, "text/html,*/*;q=0.8")
          text = re.sub(r"\s+", " ", body.decode("utf-8", "replace"))
          print("RA_STRONG_MINDED=" + str("STRONG MINDED" in text.upper()).lower())
          print("RA_FINALFIELDS_PUBLISHED=" + str("FinalFields Last Published" in text).lower())
          print("ROUND042_PROBE_COMPLETE=true")
          PY
