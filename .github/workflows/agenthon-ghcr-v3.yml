name: Agenthon GHCR v3
on:
  push:
    branches:
      - agenthon-ghcr-v3-20261005
    paths:
      - "agenthon2026/v3_chunks/**"
      - ".github/workflows/agenthon-ghcr-v3.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct verified v3 package
        shell: bash
        run: |
          set -euo pipefail
          cat agenthon2026/v3_chunks/chunk*.b64 > /tmp/agenthon_v3.b64
          test "$(wc -c < /tmp/agenthon_v3.b64)" -eq 25080
          base64 -d /tmp/agenthon_v3.b64 > /tmp/agenthon_t1_dev_v3.zip
          echo "1b9e6b88af6cf3de5221238889f4abe0f05846f1695bb7508e98e9b80af3a5c6  /tmp/agenthon_t1_dev_v3.zip" | sha256sum -c -
          mkdir -p /tmp/agenthon_v3
          unzip -q /tmp/agenthon_t1_dev_v3.zip -d /tmp/agenthon_v3
          printf '\nLABEL org.opencontainers.image.source="https://github.com/chuangmenghuan-wq/traceable-ai-workflow-prototype"\n' >> /tmp/agenthon_v3/agenthon_t1_dev_v3/Dockerfile

      - name: Build locked official Track1 sandbox
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Agenthon-2026/track1-coding-public.git /tmp/track1
          git -C /tmp/track1 checkout 84049dbc066cc02cf39c2cc18105c2f92284978d
          docker build -t finance-bench-sandbox:latest -f /tmp/track1/docker/sandbox.Dockerfile /tmp/track1

      - name: Login GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push participant image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/chuangmenghuan-wq/agenthon-t1-v3-dev:20261005"
          docker build --platform linux/amd64 -t "$IMAGE" /tmp/agenthon_v3/agenthon_t1_dev_v3
          PUSH_OUT="$(docker push "$IMAGE")"
          echo "$PUSH_OUT"
          DIGEST="$(printf '%s\n' "$PUSH_OUT" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -1)"
          test -n "$DIGEST"
          echo "IMAGE_REF=ghcr.io/chuangmenghuan-wq/agenthon-t1-v3-dev@$DIGEST"
          echo "IMAGE_DIGEST=$DIGEST"
