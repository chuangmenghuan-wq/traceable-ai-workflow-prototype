name: MLB-HSI-PUBLIC-HOLDOUT-RUN

on:
  pull_request:
    branches: [main]
    paths:
      - research/mlb_hsi_full_decision.py
      - .github/workflows/mlb-hsi-final-decision.yml
      - .github/workflows/mlb-hsi-public-holdout-run.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - run: python research/mlb_hsi_full_decision.py artifacts/mlb_hsi_final
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hsi-final-decision
          path: artifacts/mlb_hsi_final/
          if-no-files-found: error
