name: horse-round026-regime-persistence

on:
  push:
    branches:
      - research/horse-round026-regime-persistence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Execute frozen regime persistence audit
        run: python research/horse_round026_persistence.py
      - name: Commit compact research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/horse_round026
          git diff --cached --quiet && exit 0
          git commit -m "research: record horse round026 persistence results"
          git push
