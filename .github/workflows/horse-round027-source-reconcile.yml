name: horse-round027-source-reconcile

on:
  push:
    branches:
      - research/horse-round027-source-reconcile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Execute source-version reconciliation
        run: python research/horse_round027_source_reconcile.py
      - name: Commit compact research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/horse_round027
          git diff --cached --quiet && exit 0
          git commit -m "research: record horse round027 reconciled baseline"
          git push
