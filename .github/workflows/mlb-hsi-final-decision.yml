name: MLB-HSI-2026-CURRENT

on:
  push:
    branches:
      - research/mlb-hsi-final-decision-20260728
    paths:
      - research/mlb_hsi_2026_current.py
      - .github/workflows/mlb-hsi-final-decision.yml
      - research/mlb_hsi_2026_trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - research/mlb_hsi_2026_current.py
      - .github/workflows/mlb-hsi-final-decision.yml
      - research/mlb_hsi_2026_trigger.txt

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 2026 current completed-game calculation
        run: python research/mlb_hsi_2026_current.py artifacts/mlb_hsi_2026_current
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hsi-2026-current
          path: artifacts/mlb_hsi_2026_current/
          if-no-files-found: error
