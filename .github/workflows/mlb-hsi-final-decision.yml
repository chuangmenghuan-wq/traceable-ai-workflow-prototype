name: MLB-HSI-FINAL-DECISION

on:
  push:
    branches:
      - research/mlb-hsi-final-decision-20260728
    paths:
      - research/mlb_hsi_full_decision.py
      - .github/workflows/mlb-hsi-final-decision.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Run frozen holdout decision
        run: python research/mlb_hsi_full_decision.py artifacts/mlb_hsi_final
      - name: Publish summary
        if: always()
        run: |
          if [ -f artifacts/mlb_hsi_final/summary.md ]; then
            cat artifacts/mlb_hsi_final/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-hsi-final-decision
          path: artifacts/mlb_hsi_final/
          if-no-files-found: error
