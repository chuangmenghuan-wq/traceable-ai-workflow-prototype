name: horse-round045-state-parallel-paper

on:
  workflow_run:
    workflows: ["horse-round043-timed-preoff"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horse-round045-state-parallel-paper
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Evaluate parallel state paper lanes
        shell: bash
        run: |
          python research/horse_round045_state_parallel_validator.py

      - name: Persist round045 evidence if produced
        shell: bash
        run: |
          if git status --porcelain research_outputs/horse_round045 | grep -q .; then
            git config user.name "future-ability-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add research_outputs/horse_round045
            git commit -m "research: round045 state parallel paper evaluation"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new round045 evidence to persist."
          fi
