name: horse-round040-credential-injection
on:
  push:
    branches:
      - research/horse-round040-credential-injection
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: horse-round040-credential-injection
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      BETFAIR_DELAYED_APP_KEY: ${{ secrets.BETFAIR_DELAYED_APP_KEY }}
      BETFAIR_CERT_PEM: ${{ secrets.BETFAIR_CERT_PEM }}
      BETFAIR_CERT_KEY_PEM: ${{ secrets.BETFAIR_CERT_KEY_PEM }}
      BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
      BETFAIR_SSOID: ${{ secrets.BETFAIR_SSOID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pynacl
      - name: Execute credential injection contract
        run: python research/horse_round040_credential_injection_contract.py
      - name: Commit sanitized contract receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/horse_round040
          git diff --cached --quiet && exit 0
          git commit -m "research: record horse round040 credential injection contract"
          git push
