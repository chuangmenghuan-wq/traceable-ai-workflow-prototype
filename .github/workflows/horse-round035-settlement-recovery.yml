name: horse-round035-settlement-recovery
on:
  push:
    branches:
      - research/horse-round035-settlement-recovery
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horse-round035-settlement-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery dependencies
        run: pip install numpy pandas requests
      - name: Validate results API and rebuild August settlement ledger
        run: python research/horse_round035_results_recovery_v2.py
      - name: Commit compact recovery outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/horse_round035
          git diff --cached --quiet && exit 0
          git commit -m "research: record horse round035 recovered settlement ledger"
          git push
