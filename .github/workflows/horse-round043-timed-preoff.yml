name: horse-round043-timed-preoff
# Round047 live-capture verification trigger; no strategy/data logic changed.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/horse-round043-timed-preoff.yml
      - research/horse_round043_schedule_capture.py
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horse-round043-timed-preoff
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run schedule-aware preoff capture capability
        shell: bash
        run: python research/horse_round043_schedule_capture.py

      - name: Persist schedule plans and timed evidence
        shell: bash
        run: |
          if git status --porcelain research_outputs/horse_round043 | grep -q .; then
            git config user.name "future-ability-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add research_outputs/horse_round043
            git commit -m "research: round043 schedule-aware timed evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new round043 schedule/timed evidence to persist."
          fi
